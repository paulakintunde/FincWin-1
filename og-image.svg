<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="0%" r="70%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#dce8d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Border frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Logo mark — simplified "F" icon -->
  <rect x="72" y="72" width="52" height="52" rx="12" fill="#5a6e3f"/>
  <text x="98" y="107" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">F</text>

  <!-- Brand name -->
  <text x="138" y="107" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#111111" letter-spacing="-0.5">Finc<tspan fill="#5a6e3f">Win</tspan></text>

  <!-- Main headline -->
  <text x="72" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="400" fill="#111111" letter-spacing="-1">Your finances.</text>
  <text x="72" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="400" font-style="italic" fill="#5a6e3f" letter-spacing="-1">Your device.</text>

  <!-- Subline -->
  <text x="72" y="440" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="300" fill="#6b7280" letter-spacing="0">Privacy-first personal finance · Free to start · No bank login required</text>

  <!-- Pill badges -->
  <rect x="72" y="490" width="130" height="40" rx="20" fill="#f5f4f0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="137" y="515" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#5a6e3f" text-anchor="middle" letter-spacing="0.5">FREE TIER</text>

  <rect x="214" y="490" width="160" height="40" rx="20" fill="#f5f4f0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="294" y="515" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="0.5">PRO $39/YEAR</text>

  <rect x="386" y="490" width="180" height="40" rx="20" fill="#5a6e3f"/>
  <text x="476" y="515" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">LIFETIME $149</text>

  <!-- URL -->
  <text x="1128" y="107" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#9ca3af" text-anchor="end" letter-spacing="0">fincwin.com</text>
</svg>
