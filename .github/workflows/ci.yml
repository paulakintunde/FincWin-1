name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  firestore-rules-guard:
    name: Firestore rules safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if firestore.rules allows unrestricted access
        run: |
          if grep -qE 'allow\s+read,?\s*write\s*:\s*if\s+true' firestore.rules; then
            echo "ERROR: firestore.rules contains 'allow read, write: if true' — this would expose all user data."
            echo "Review firestore.rules and tighten the rule before merging."
            exit 1
          fi
          echo "firestore.rules check passed."

  api-lint:
    name: API files present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required API endpoints exist
        run: |
          for f in api/activate.js api/validate.js api/admin.js api/contact.js; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing"
              exit 1
            fi
          done
          echo "All API endpoints present."
